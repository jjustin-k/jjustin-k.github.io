<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap-5.3.2-dist/css/bootstrap.css">
    <link rel="stylesheet" href="stlye.css">
    <link rel="stylesheet" href="home.css">
    <script src="bootstrap-5.3.2-dist/js/bootstrap.bundle.js"></script>
    <title>Justin Kwinecki's Portfolio</title>
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary-dark">
    <div class="container-fluid">
      <h1 class="name-title">JUSTIN KWINECKI</h1>
      <ul class="nav justify-content-end">
        <li class="nav-item">
          <a class="nav-link active" href="#">HOME</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/projects.html">PROJECTS</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/About.html">ABOUT</a>
        </li>
      </ul>
    </div>
  </nav>
  <div class="container-fluid">
    <div class="home d-flex justify-content-center mx-auto">
      <div class="d-flex flex-column justify-content-center">
        <span class="homeText"></span>
        <span class="name"></span>
        <br>
        <span class="cover"></span>
        <span class="parText"></span>
        <span class="parT"></span>
        <br>
        <div class="d-flex text-center mx-auto ">
          <a href="https://www.linkedin.com/in/justin-kwinecki-8a479a255/" class="px-4"><img class="clickables" src="images/linkedin.png" alt="LinkedIn"></a>
          <a href="https://github.com/jjustin-k" class="px-4"><img class="clickables" src="images/GitHub.png" alt="GitHub"></a>
        </div>
      </div>
    </div>
    <img class="img-fluid " src="images/IMG_0151.jpg" alt="Justin Kwinecki">
  </div>

  <script>
    const span = document.querySelector(".homeText");
    const homeText = "Hello There, I'm";
    const eng = document.querySelector(".cover");
    const cover = "Software Engineering Student";
    const texts = document.querySelector(".parText");
    const parText = "Current third year Software Engineering Student at McMaster University";
    const again = document.querySelector(".parT");
    const parT = "Software Engineer @ Synopsys";
    const myname = document.querySelector(".name");
    const name = "Justin Kwinecki";
    
    function textTypingEffect(element, text, i = 0) {
      if (i < text.length) {
        element.textContent += text[i];
        setTimeout(() => textTypingEffect(element, text, i + 1), 50);
      }
    }
    
    function textTypingEffectfin(element, text, i = 0) {
      if (i < text.length) {
        element.textContent += text[i];
        setTimeout(() => textTypingEffectfin(element, text, i + 1), 16);
      }
    }
    
    function textTypingEffectext(element, text, i = 0) {
      if (i < text.length) {
        element.textContent += text[i];
        setTimeout(() => textTypingEffectext(element, text, i + 1), 27);
      }
    }
    
    textTypingEffect(span, homeText);
    textTypingEffect(myname, name);
    textTypingEffect(eng, cover);
    textTypingEffectfin(texts, parText);
    textTypingEffectext(again, parT);
  </script>
</body>
</html>
